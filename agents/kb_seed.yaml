docs:
  - slug: return_policy
    title: 退换货政策
    body: |
      签收后 15 天内支持无理由退货，商品需完好且配件齐全。
      退货审核通过后退款原路返回，到账时间 1-3 个工作日。
      换货仅支持同款不同尺码/颜色，运费由平台承担。
      定制类商品与已激活的数码商品不支持无理由退货。
  - slug: refund_policy
    title: 退款政策
    body: |
      退款金额不超过订单实付金额，扣除已退款部分。
      同一客户 30 天内退款次数上限 2 次，超出需人工审核。
      单笔退款超过 200 元需人工审批后执行。
      未签收订单仅在物流停滞超过 7 天时允许提前退款，且需人工审批。
      退款进度可在订单详情查询，状态为 pending/processing/succeeded。
  - slug: logistics_sla
    title: 物流时效与停滞处理
    body: |
      标准快递发货后 3-5 天送达，偏远地区 5-8 天。
      物流信息超过 7 天无更新视为停滞，可联系承运商催件或申请提前退款。
      催件后 48 小时内仍无更新的，升级人工跟进。
  - slug: invoice_policy
    title: 发票开具政策
    body: |
      订单签收后可开具电子普通发票，抬头与税号由客户提供。
      已开票订单不可重复开票；换开需人工处理。
      电子发票在开具后 24 小时内发送至客户邮箱。
  - slug: shipping_fee
    title: 运费规则
    body: |
      单笔订单满 99 元包邮，不足收取 8 元运费。
      无理由退货运费由客户承担，质量问题退货运费由平台承担。